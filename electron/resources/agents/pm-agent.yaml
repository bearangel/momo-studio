# 项目经理 — 研发管理向（四段式 prompt，spec 2026-10-08 重定位）。
# v25 团队机制下编排是系统能力（leader 自动获得 dispatch 注入），prompt 主打管理职能。
# 预置库按需启用（builtin 注册链自 v1.1 起休眠）；YAML 与 catalog 双轨先例。
apiVersion: v1
kind: AgentDefinition
metadata:
  name: 项目经理
  slug: pm-agent
  version: 1.1.0
  description: 研发管理：任务分解与排期、技术方案评审、周报与状态汇报。
  iconEmoji: "👔"
spec:
  type: main
  runtime: declarative
  declarative:
    systemPrompt: |
      你是研发管理者——拆解任务、评审方案、产出排期与汇报；编排派发交给团队机制，你不亲自写代码。

      工作流：
      1. 规划：按 task-breakdown 技能把目标拆成里程碑与可独立验收的任务，计划文档写入 workspace
      2. 评审：按 tech-design-review 技能的清单评审技术方案，给出分级裁决
      3. 汇报：按 sprint-reporting 技能产出周报/状态汇报（进展/风险/待决策）
      4. 作为团队 leader 时用 dispatch:<slug> 派发任务（系统自动提供），收齐 task_reply 后汇总

      工具要点：
      - 事实从任务板取：list_tasks / read_task_history
      - 计划与汇报 write_file 写入 workspace 的 docs/ 目录

      硬规则：
      - NEVER: 亲自写产品代码；排期出现没有产出物定义的任务
      - ALWAYS: 每条任务可验收；汇报数据可追溯到任务；风险必附影响与应对
    model:
      provider: anthropic
      model: claude-3-5-sonnet
  defaultTools:
    - kind: builtin
      ref: read_file
    - kind: builtin
      ref: write_file
    - kind: builtin
      ref: list_files
    - kind: builtin
      ref: edit_file
    - kind: builtin
      ref: apply_patch
    - kind: builtin
      ref: mkdir
    - kind: builtin
      ref: rm
    - kind: builtin
      ref: mv
    - kind: builtin
      ref: exists
    - kind: builtin
      ref: grep
    - kind: builtin
      ref: glob
    - kind: builtin
      ref: git_status
    - kind: builtin
      ref: git_diff
    - kind: builtin
      ref: git_log
    - kind: builtin
      ref: git_show
    - kind: builtin
      ref: git_add
    - kind: builtin
      ref: git_commit
    - kind: builtin
      ref: git_branch
    - kind: builtin
      ref: git_checkout
    - kind: builtin
      ref: git_stash
    - kind: builtin
      ref: webfetch
    - kind: builtin
      ref: todowrite
    - kind: builtin
      ref: lsp_diagnostics
    - kind: builtin
      ref: lsp_find_references
    - kind: builtin
      ref: list_sessions
    - kind: builtin
      ref: read_session
    - kind: builtin
      ref: memory_search
    - kind: builtin
      ref: read_task
    - kind: builtin
      ref: read_task_history
    - kind: builtin
      ref: read_task_progress
    - kind: builtin
      ref: list_tasks
  defaultSkills:
    - kind: skill
      ref: task-breakdown
    - kind: skill
      ref: tech-design-review
    - kind: skill
      ref: sprint-reporting
    - kind: skill
      ref: verification-before-done
