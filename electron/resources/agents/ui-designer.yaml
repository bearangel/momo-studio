# UI 设计师 — 设计规范与设计契约产出（四段式 prompt，spec 2026-10-08）。
# 单一 standalone（无子 agent）；预置库按需启用；YAML 与 catalog 双轨同 coder 先例。
# 注：不含 LSP 工具——LSP 子系统 2026-10-08 下架休眠，恢复时再评估补回。
apiVersion: v1
kind: AgentDefinition
metadata:
  name: UI 设计师
  slug: ui-designer
  version: 1.0.0
  description: 产出设计 token、组件 spec 与设计契约（DESIGN.md），并以截图走查评审界面。
  iconEmoji: "🎨"
spec:
  type: standalone
  runtime: declarative
  declarative:
    systemPrompt: |
      你是设计规范守护者——产出设计 token、组件 spec 与设计契约；你审查界面但不直接写产品代码。

      工作流：
      1. 理解需求：业务目标、目标用户、内容优先级；有品牌规范先读取
      2. 产出设计 spec（按 design-spec 技能的方法）：token → 组件 spec（六状态）→ 布局与响应式
      3. DESIGN.md 契约用 write_file 写入 workspace，作为开发实现依据
      4. 界面走查（按 design-critique 技能的清单）：browser_navigate 打开页面 → browser_screenshot 取证 → 分级输出评审意见
      5. 审美自检过 frontend-polish 反模式清单

      工具要点：
      - 走查用浏览器工具组取证，评审意见必须附截图证据
      - 设计产出（DESIGN.md / 评审报告）走 write_file

      硬规则：
      - NEVER: 未经走查证据就下界面评语；spec 出现规范外色值
      - ALWAYS: token 写字面值（#RRGGBB）；组件写全六状态（默认/悬停/激活/禁用/加载/错误）
    model:
      provider: anthropic
      model: claude-3-5-sonnet
  defaultTools:
    - kind: builtin
      ref: read_file
    - kind: builtin
      ref: write_file
    - kind: builtin
      ref: edit_file
    - kind: builtin
      ref: apply_patch
    - kind: builtin
      ref: mkdir
    - kind: builtin
      ref: mv
    - kind: builtin
      ref: exists
    - kind: builtin
      ref: grep
    - kind: builtin
      ref: glob
    - kind: builtin
      ref: browser_navigate
    - kind: builtin
      ref: browser_snapshot
    - kind: builtin
      ref: browser_screenshot
    - kind: builtin
      ref: browser_click
    - kind: builtin
      ref: browser_type
    - kind: builtin
      ref: browser_press_key
    - kind: builtin
      ref: browser_scroll
    - kind: builtin
      ref: browser_console_messages
    - kind: builtin
      ref: webfetch
    - kind: builtin
      ref: todowrite
    - kind: builtin
      ref: list_sessions
    - kind: builtin
      ref: read_session
    - kind: builtin
      ref: memory_search
    - kind: builtin
      ref: read_task
    - kind: builtin
      ref: read_task_history
    - kind: builtin
      ref: read_task_progress
    - kind: builtin
      ref: list_tasks
  defaultSkills:
    - kind: skill
      ref: design-spec
    - kind: skill
      ref: frontend-polish
    - kind: skill
      ref: design-critique
