<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代码图谱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 12px/1.6 -apple-system, 'PingFang SC', sans-serif; padding: 12px; height: 100vh; display: flex; flex-direction: column; gap: 8px; }
  .card { border: 1px solid #9996; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .k { color: #888; }
  .v { font-family: ui-monospace, Menlo, monospace; word-break: break-all; text-align: right; }
  .hint { color: #888; font-size: 11px; line-height: 1.7; }
  .status { font-size: 11px; color: #888; min-height: 16px; }
  .status.err { color: #d33; }
  .ok { color: #3a3; }
</style>
</head>
<body>
<div class="card" id="stats">
  <div class="row"><span class="k">索引根目录</span><span class="v" id="root">…</span></div>
  <div class="row"><span class="k">引擎版本</span><span class="v" id="ver">…</span></div>
  <div class="row"><span class="k">索引数据</span><span class="v" id="idx">…</span></div>
</div>
<div class="hint">
  v2.0 起索引与查询由内置 codegraph 引擎（MCP server）提供，随会话按需启动、自动增量同步。
  在智能体会话中直接提问（如「X 方法被谁调用」），agent 会使用 <b>codegraph_explore</b> 查询；
  索引数据位于项目根 <b>.momo-codegraph/</b> 目录。
</div>
<div class="status" id="status"></div>
<script>
  // v2.0 状态卡（引擎整合）：数据源 = service stats（fs 统计），图查询能力移交会话内 MCP 工具。
  // 沙箱 iframe origin='null'——双向 postMessage '*'，宿主以 source 校验身份。
  var seq = 0;
  var pending = {};
  function send(type, extra) {
    var id = ++seq;
    parent.postMessage(Object.assign({ type: type, id: id }, extra || {}), '*');
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      setTimeout(function () {
        if (pending[id]) { pending[id].reject(new Error('rpc 超时')); delete pending[id]; }
      }, 8000);
    });
  }
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.type !== 'rpc:result' || !pending[m.id]) return;
    if (m.error !== undefined) pending[m.id].reject(new Error(String(m.error)));
    else pending[m.id].resolve(m.result);
    delete pending[m.id];
  });
  function fmtBytes(b) {
    if (b > 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b > 1024) return (b / 1024).toFixed(1) + ' KB';
    return b + ' B';
  }
  function refresh() {
    send('plugin:callService', { method: 'stats', params: {} })
      .then(function (s) {
        document.getElementById('root').textContent = s.workspaceRoot || '（跟随工作空间）';
        document.getElementById('ver').textContent = s.engineVersion || '-';
        var i = s.index || {};
        document.getElementById('idx').textContent = i.exists
          ? fmtBytes(i.bytes) + ' · ' + i.files + ' 文件'
          : '未建（首次查询时自动索引）';
        document.getElementById('idx').className = 'v' + (i.exists ? ' ok' : '');
        document.getElementById('status').textContent = s.hint ? s.hint : '';
      })
      .catch(function (e) {
        document.getElementById('status').className = 'status err';
        document.getElementById('status').textContent = '状态读取失败：' + e.message;
      });
  }
  send('ready').then(function () { refresh(); });
  setInterval(refresh, 15000);
</script>
</body>
</html>
