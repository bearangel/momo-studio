<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代码图谱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 12px/1.6 -apple-system, 'PingFang SC', sans-serif; padding: 10px; height: 100vh; display: flex; flex-direction: column; gap: 8px; }
  .search { display: flex; gap: 6px; }
  .search input { flex: 1; border: 1px solid #9996; border-radius: 6px; padding: 4px 8px; font: inherit; background: transparent; }
  .search button { border: 1px solid #9996; border-radius: 6px; padding: 4px 10px; background: transparent; cursor: pointer; font: inherit; }
  .stats { color: #888; font-size: 11px; }
  .canvas { flex: 1; border: 1px dashed #9995; border-radius: 8px; position: relative; overflow: hidden; min-height: 0; }
  .node { position: absolute; padding: 3px 8px; border: 1px solid #9996; border-radius: 6px; background: rgba(127,127,127,0.08); font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: nowrap; }
  .node.center { border-color: var(--accent); color: var(--accent); background: rgba(94,106,210,0.12); font-weight: 600; }
  .status { font-size: 11px; color: #888; min-height: 16px; }
  .status.err { color: #d33; }
</style>
</head>
<body>
<div class="search">
  <input id="q" placeholder="符号名（如 transitionTaskStatus）…" />
  <button id="go">查询</button>
</div>
<div class="stats" id="stats">连接中…</div>
<div class="canvas" id="canvas"></div>
<div class="status" id="status"></div>
<script>
  // P5 codegraph 面板（spec §2.5/§8.2/§8.5）：查询邻域图 + 事件驱动刷新。
  // 沙箱 iframe origin='null'——双向 postMessage '*'，宿主以 source 校验身份。
  var seq = 0;
  var pending = {};
  var accent = 'rgb(94,106,210)';
  var refreshTimer = null;
  function send(type, extra) {
    var id = ++seq;
    parent.postMessage(Object.assign({ type: type, id: id }, extra || {}), '*');
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      setTimeout(function () {
        if (pending[id]) { pending[id].reject(new Error('rpc 超时')); delete pending[id]; }
      }, 8000);
    });
  }
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.type !== 'rpc:result' || !pending[m.id]) return;
    if (m.error !== undefined) pending[m.id].reject(new Error(String(m.error)));
    else pending[m.id].resolve(m.result);
    delete pending[m.id];
  });
  function applyTheme(theme) {
    if (theme && theme.tokens) {
      var a = theme.tokens['--accent-500'];
      if (a) accent = a;
      var bg = theme.tokens['--surface-1'];
      if (bg) document.body.style.background = bg;
    }
  }
  function fmtStats(s) {
    return '文件 ' + s.files + ' · 符号 ' + s.symbols + ' · 调用边 ' + s.edges +
      ' · 索引于 ' + new Date(s.lastIndexedAt).toLocaleTimeString();
  }
  function render(g, centerId) {
    var c = document.getElementById('canvas');
    c.innerHTML = '';
    var nodes = g.nodes || [];
    var edges = g.edges || [];
    if (nodes.length === 0) { document.getElementById('status').textContent = '无数据（service 未启动或索引为空）'; return; }
    // 布局：中心符号居中，其余环形
    var W = c.clientWidth || 260, H = c.clientHeight || 300;
    var pos = {};
    var center = nodes.find(function (n) { return n.id === centerId; }) || nodes[0];
    nodes.forEach(function (n, i) {
      if (n === center) { pos[n.id] = { x: W / 2 - 40, y: H / 2 - 12 }; return; }
      var others = nodes.filter(function (x) { return x !== center; });
      var k = others.indexOf(n);
      var ang = (2 * Math.PI * k) / Math.max(1, others.length) - Math.PI / 2;
      var r = Math.min(W, H) / 2 - 50;
      pos[n.id] = { x: W / 2 + r * Math.cos(ang), y: H / 2 + r * Math.sin(ang) };
    });
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    svg.style.position = 'absolute'; svg.style.inset = '0';
    edges.forEach(function (e) {
      if (!pos[e.from] || !pos[e.to]) return;
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', pos[e.from].x + 30); l.setAttribute('y1', pos[e.from].y + 10);
      l.setAttribute('x2', pos[e.to].x + 30); l.setAttribute('y2', pos[e.to].y + 10);
      l.setAttribute('stroke', 'rgba(128,128,128,0.5)');
      l.setAttribute('stroke-width', '1.5');
      svg.appendChild(l);
    });
    c.appendChild(svg);
    nodes.forEach(function (n) {
      var d = document.createElement('div');
      d.className = 'node' + (n === center ? ' center' : '');
      d.textContent = n.id;
      d.style.left = pos[n.id].x + 'px';
      d.style.top = pos[n.id].y + 'px';
      if (n === center) d.style.borderColor = accent, d.style.color = accent;
      c.appendChild(d);
    });
    document.getElementById('status').textContent = '近似调用图（regex）· 节点 ' + nodes.length;
  }
  function refresh(symbol) {
    send('plugin:callService', { method: 'graph', params: symbol ? { symbol: symbol } : {} })
      .then(function (r) {
        document.getElementById('stats').textContent = fmtStats(r.stats || {});
        render(r, symbol);
      })
      .catch(function (e) {
        document.getElementById('status').className = 'status err';
        document.getElementById('status').textContent = '图查询失败：' + e.message;
      });
  }
  send('ready').then(function (r) { applyTheme(r.result); document.getElementById('stats').textContent = '已连接'; refresh(); });
  send('app:subscribe', { events: ['taskCompleted', 'taskStatusChanged'] }).catch(function () {});
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (m && m.type === 'event') {
      // 任务事件 → 防抖刷新（§8.5：agent 改代码 → watcher 增量 → 面板刷新）
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(function () { refresh(document.getElementById('q').value.trim() || undefined); }, 1200);
    }
    if (m && m.type === 'event' && m.event === 'theme' && m.payload) applyTheme(m.payload);
  });
  document.getElementById('go').addEventListener('click', function () { refresh(document.getElementById('q').value.trim() || undefined); });
  document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') refresh(e.target.value.trim() || undefined); });
</script>
</body>
</html>
